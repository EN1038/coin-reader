<!doctype html><html lang="th"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ชำระสำเร็จ</title><link rel="stylesheet" href="app.css"/>
<style>.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.icon{width:80px;height:80px;border-radius:50%;background:var(--ok-bg);display:grid;place-items:center;font-size:36px;margin-bottom:20px;color:var(--ok)}
</style></head><body>
<div class="phone" id="screen">
  <div class="status"><span>9:41</span><span class="icons">▮▮▮ 📶 🔋</span></div>
  <div class="topbar"><div class="title">ผลการชำระเงิน</div></div>
  <div class="content center">
    <div class="icon">✓</div>
    <h1 style="font-size:22px;margin-bottom:8px">เติมเหรียญสำเร็จ</h1>
    <p style="color:var(--text-muted);font-size:14px;line-height:1.6">ได้ 🪙 <strong style="color:var(--text)">100</strong> เหรียญเข้ากระเป๋าแล้ว<br/><span class="ex">(จำลอง · ตัวอย่าง)</span></p>
    <div class="card" style="width:100%;margin-top:24px;text-align:left;background:var(--ok-bg);border-color:#C6E8D4">
      <div class="row-between" style="margin-bottom:8px"><span>ยอดก่อนหน้า</span><span>248</span></div>
      <div class="row-between" style="margin-bottom:8px"><span>เติม</span><span style="color:var(--ok);font-weight:600">+100</span></div>
      <div class="row-between" style="border-top:1px solid #C6E8D4;padding-top:8px"><span style="font-weight:600">ยอดใหม่</span><span style="font-family:var(--font-head);font-weight:700;font-size:18px">🪙 348</span></div>
    </div>
    <p style="font-size:12px;color:var(--note);margin-top:16px;background:var(--note-bg);padding:10px 12px;border-radius:10px;width:100%">เหรียญคืนเป็นเงินสดไม่ได้</p>
    <button class="btn btn-primary btn-block" style="margin-top:20px">กลับไปอ่านต่อ</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px">ดูกระเป๋า</button>
  </div>
</div>
</body></html>
