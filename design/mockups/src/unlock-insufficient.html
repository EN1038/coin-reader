<!doctype html><html lang="th"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>เหรียญไม่พอ</title><link rel="stylesheet" href="app.css"/>
</head><body>
<div class="phone" id="screen">
  <div class="status"><span>9:41</span><span class="icons">▮▮▮ 📶 🔋</span></div>
  <div class="topbar"><button class="icon-btn">←</button><div class="title">ปลดล็อกตอน</div></div>
  <div class="content" style="display:flex;flex-direction:column">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center">
      <div style="width:80px;height:80px;border-radius:50%;background:var(--c-violet-50);display:grid;place-items:center;font-size:36px;margin-bottom:20px">🪙</div>
      <h1 style="font-size:22px;margin-bottom:8px">เหรียญไม่พอ</h1>
      <p style="color:var(--text-muted);font-size:14px;line-height:1.6;max-width:280px">ตอนนี้ราคา <strong style="color:var(--text)">8 เหรียญ</strong> แต่คุณมีเพียง <strong style="color:var(--text)">3 เหรียญ</strong><br/><span class="ex">(ตัวเลขตัวอย่าง)</span></p>
      <div class="card" style="width:100%;margin-top:24px;text-align:left">
        <div class="row-between" style="margin-bottom:8px"><span>ต้องการ</span><span>🪙 8</span></div>
        <div class="row-between" style="margin-bottom:8px"><span>มีอยู่</span><span>🪙 3</span></div>
        <div class="row-between" style="border-top:1px solid var(--line);padding-top:8px"><span style="font-weight:600">ขาดอีก</span><span style="font-family:var(--font-head);font-weight:700;color:var(--danger)">🪙 5</span></div>
      </div>
    </div>
    <div style="padding:16px;border-top:1px solid var(--line);background:var(--surface)">
      <div class="mock-banner" style="margin-bottom:12px;font-size:11px">ไปหน้าเติมเหรียญ (mock)</div>
      <button class="btn btn-coin btn-block">เติมเหรียญ</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px">กลับ</button>
    </div>
  </div>
</div>
</body></html>
