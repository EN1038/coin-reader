<!doctype html><html lang="th"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Twilight Blue — ส่งลิงก์แล้ว</title>
<link rel="stylesheet" href="app.css"/><link rel="stylesheet" href="twilight.css"/>
<style>
.panel{margin:48px 20px 0;text-align:center;padding:28px 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-1)}
.icon{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:28px;margin:0 auto 16px}
</style></head><body data-theme="light">
<div class="phone" id="screen">
  <div class="status"><span>9:41</span><span class="icons">▮▮▮ 📶 🔋</span></div>
  <div class="topbar"><button class="icon-btn">←</button><div class="title">ลืมรหัสผ่าน</div></div>
  <div class="content">
    <div class="panel">
      <div class="icon">✓</div>
      <h1 style="font-size:20px;margin-bottom:8px">ส่งลิงก์แล้ว (mock)</h1>
      <p style="font-size:14px;color:var(--text-muted);line-height:1.65">ถ้ามีบัญชีที่ <strong style="color:var(--text)">demo@example.com</strong> ระบบจำลองว่าส่งลิงก์รีเซ็ตแล้ว · ใน MVP นี้ไม่ออกอีเมลจริง</p>
      <div class="badge badge-ex" style="margin-top:12px">สถานะตัวอย่าง</div>
      <button class="btn btn-primary btn-block" style="margin-top:20px">กลับเข้าสู่ระบบ</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px">ส่งอีกครั้งใน 60 วิ</button>
    </div>
    <p style="text-align:center;margin:20px 24px;font-size:12px;color:var(--text-muted);line-height:1.5">ไม่พบอีเมล? ตรวจสแปม หรือสมัครใหม่ · ไม่เกี่ยวกับการคืนเหรียญ</p>
  </div>
</div>
</body></html>
