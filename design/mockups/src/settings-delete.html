<!doctype html><html lang="th"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Twilight Blue — ลบบัญชี</title>
<link rel="stylesheet" href="app.css"/><link rel="stylesheet" href="twilight.css"/>
<style>
.form{padding:16px}
.list{margin:12px 0 16px;padding:14px;border-radius:14px;background:var(--danger-bg);border:1px solid #F0C8D0;font-size:13px;line-height:1.65;color:var(--danger)}
.list ul{padding-left:18px;margin:8px 0 0}
</style></head><body data-theme="light">
<div class="phone" id="screen">
  <div class="status"><span>9:41</span><span class="icons">▮▮▮ 📶 🔋</span></div>
  <div class="topbar"><button class="icon-btn">←</button><div class="title">ลบบัญชี</div></div>
  <div class="content">
    <div class="form">
      <h2 style="font-size:20px;margin-bottom:8px">ยืนยันการลบบัญชี</h2>
      <p style="font-size:14px;color:var(--text-muted);line-height:1.6">การดำเนินการนี้ปิดบัญชี Twilight Blue ของคุณ (ตัวอย่าง flow · ยังไม่ลบข้อมูลจริงในม็อก)</p>
      <div class="list">
        <strong>สิ่งที่จะเกิดหลังยืนยัน</strong>
        <ul>
          <li>เข้าสู่ระบบด้วยอีเมลนี้ไม่ได้</li>
          <li>ชั้นหนังสือและประวัติการอ่านเข้าไม่ได้</li>
          <li>เหรียญคงเหลือ <u>ไม่คืนเป็นเงินสด</u> และใช้ต่อไม่ได้</li>
        </ul>
      </div>
      <div class="field"><label>พิมพ์ DELETE เพื่อยืนยัน</label><input placeholder="DELETE" value=""/></div>
      <div class="field"><label>รหัสผ่าน</label><input type="password" placeholder="••••••••"/></div>
      <button class="btn btn-danger btn-block" style="margin-top:8px">ลบบัญชีถาวร</button>
      <button class="btn btn-ghost btn-block" style="margin-top:10px">ยกเลิก</button>
    </div>
  </div>
</div>
</body></html>
