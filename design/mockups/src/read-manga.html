<!doctype html><html lang="th"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>อ่านมังงะ</title><link rel="stylesheet" href="app.css"/>
<style>
body{background:#141210}
.phone{background:#0A0A0A;color:var(--c-reader-text)}
.rtop{height:52px;padding:0 8px;display:flex;align-items:center;gap:4px;background:rgba(10,10,10,.92);border-bottom:1px solid #222;flex-shrink:0}
.rtop .t{flex:1;text-align:center;font-family:var(--font-head);font-size:13px;font-weight:600;color:#999}
.rtop button{width:40px;height:40px;border:none;background:none;color:#eee;font-size:16px}
.pages{display:flex;flex-direction:column;gap:2px;padding-bottom:80px}
.page{width:100%;aspect-ratio:3/4;background:linear-gradient(180deg,#1A1A1A,#111);position:relative;display:flex;align-items:center;justify-content:center;color:#555;font-family:var(--font-head);font-size:13px;overflow:hidden}
.page .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-size:14px;color:rgba(255,255,255,.08);font-family:var(--font-head);font-weight:700;
  transform:rotate(-28deg);letter-spacing:.08em;white-space:nowrap}
.page .panel{position:absolute;border:1px solid #333;border-radius:4px;background:#1E1E1E}
.rbot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 20px;background:linear-gradient(transparent,#0A0A0A);display:flex;justify-content:center}
.rbot .hint{font-size:12px;color:#777;font-family:var(--font-head)}
</style></head><body>
<div class="phone" id="screen">
  <div class="status" style="color:#eee"><span>9:41</span><span class="icons">▮▮▮ 📶 🔋</span></div>
  <div class="rtop">
    <button>←</button>
    <div class="t">สายลมทิศใต้ · ตอนที่ 1</div>
    <button>⋯</button>
  </div>
  <div class="content">
    <div style="padding:8px 16px;font-size:11px;color:#777;display:flex;gap:8px;align-items:center">
      <span class="badge badge-ex">หน้ามังงะตัวอย่าง</span>
      <span>เลื่อนลงเพื่ออ่าน · watermark ตัวอย่าง</span>
    </div>
    <div class="pages">
      <div class="page" style="aspect-ratio:3/4.2">
        <div class="panel" style="top:8%;left:6%;width:88%;height:40%"></div>
        <div class="panel" style="top:52%;left:6%;width:42%;height:40%"></div>
        <div class="panel" style="top:52%;right:6%;width:42%;height:40%"></div>
        <div class="wm">uid:example-user-001 · Coin Reader</div>
        <span style="position:absolute;bottom:12px;font-size:11px;color:#444">หน้า 1 / ตัวอย่าง</span>
      </div>
      <div class="page">
        <div class="panel" style="top:6%;left:6%;width:88%;height:28%"></div>
        <div class="panel" style="top:38%;left:6%;width:88%;height:54%"></div>
        <div class="wm">uid:example-user-001 · Coin Reader</div>
        <span style="position:absolute;bottom:12px;font-size:11px;color:#444">หน้า 2 / ตัวอย่าง</span>
      </div>
      <div class="page" style="aspect-ratio:3/3.6">
        <div class="panel" style="top:8%;left:6%;width:42%;height:84%"></div>
        <div class="panel" style="top:8%;right:6%;width:42%;height:40%"></div>
        <div class="panel" style="top:52%;right:6%;width:42%;height:40%"></div>
        <div class="wm">uid:example-user-001 · Coin Reader</div>
        <span style="position:absolute;bottom:12px;font-size:11px;color:#444">หน้า 3 / ตัวอย่าง</span>
      </div>
    </div>
  </div>
  <div class="rbot"><span class="hint">↕ เลื่อนแนวตั้ง · signed URL อายุสั้น (MVP)</span></div>
</div>
</body></html>
