<!doctype html><html lang="th"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Twilight Blue — ลืมรหัสผ่าน</title>
<link rel="stylesheet" href="app.css"/><link rel="stylesheet" href="twilight.css"/>
<style>
.brand{text-align:center;padding:28px 24px 8px}
.brand .mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,#3D5A80,#182D49);margin:0 auto 14px;display:grid;place-items:center;font-size:26px;color:#DDC89D;box-shadow:var(--sh-2)}
.brand h1{font-size:22px}.brand p{font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.5}
.form{padding:12px 20px 24px}
.fine{font-size:12px;color:var(--text-muted);text-align:center;padding:0 24px;line-height:1.5}
</style></head><body data-theme="light">
<div class="phone" id="screen">
  <div class="status"><span>9:41</span><span class="icons">▮▮▮ 📶 🔋</span></div>
  <div class="topbar"><button class="icon-btn">←</button><div class="title">ลืมรหัสผ่าน</div></div>
  <div class="content">
    <div class="brand">
      <div class="mark">☽</div>
      <h1>รีเซ็ตรหัสผ่าน</h1>
      <p>กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์รีเซ็ต<br/>(mock · ไม่อีเมลจริง)</p>
    </div>
    <div class="form">
      <div class="field"><label>อีเมล</label><input type="email" placeholder="you@example.com" value="demo@example.com"/></div>
      <button class="btn btn-primary btn-block" style="margin-top:8px">ส่งลิงก์รีเซ็ต</button>
      <p class="fine" style="margin-top:16px">จำรหัสได้แล้ว? <a style="color:var(--primary);font-weight:600;font-family:var(--font-head)">เข้าสู่ระบบ</a></p>
    </div>
  </div>
</div>
</body></html>
