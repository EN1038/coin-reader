<!doctype html><html lang="th"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>สมัคร</title><link rel="stylesheet" href="app.css"/>
<style>
.form{padding:20px}.fine{font-size:12px;color:var(--text-muted);text-align:center;padding:0 24px 24px;line-height:1.5}
.fine a{color:var(--primary);font-weight:600}
</style></head><body>
<div class="phone" id="screen">
  <div class="status"><span>9:41</span><span class="icons">▮▮▮ 📶 🔋</span></div>
  <div class="topbar"><button class="icon-btn">←</button><div class="title">สมัครสมาชิก</div></div>
  <div class="content">
    <div class="form">
      <div class="field"><label>ชื่อที่แสดง</label><input placeholder="ชื่อเล่น"/></div>
      <div class="field"><label>อีเมล</label><input type="email" placeholder="you@example.com"/></div>
      <div class="field"><label>รหัสผ่าน</label><input type="password" placeholder="อย่างน้อย 8 ตัวอักษร"/></div>
      <div class="field"><label>ยืนยันรหัสผ่าน</label><input type="password"/></div>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-muted);margin:8px 0 16px;line-height:1.45">
        <input type="checkbox" style="margin-top:3px;width:18px;height:18px" checked/>
        <span>ฉันยอมรับ <a style="color:var(--primary);font-weight:600">ข้อกำหนด</a> · <a style="color:var(--primary);font-weight:600">ความเป็นส่วนตัว</a> · และรับทราบว่า<strong style="color:var(--text)"> เหรียญคืนเป็นเงินสดไม่ได้</strong></span>
      </label>
      <button class="btn btn-primary btn-block">สร้างบัญชี</button>
      <div style="text-align:center;margin-top:16px;font-size:14px">มีบัญชีแล้ว? <a href="#" style="color:var(--primary);font-weight:600">เข้าสู่ระบบ</a></div>
    </div>
    <div style="padding:0 20px">
      <div class="div" style="display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:12px;margin-bottom:12px"><span style="flex:1;height:1px;background:var(--line)"></span>หรือ<span style="flex:1;height:1px;background:var(--line)"></span></div>
      <button class="btn btn-ghost btn-block" style="margin-bottom:10px">สมัครด้วย Google</button>
      <button class="btn btn-ghost btn-block">สมัครด้วย LINE</button>
    </div>
  </div>
</div>
</body></html>
