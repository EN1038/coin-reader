<!doctype html><html lang="th"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ยืนยันปลดล็อก</title><link rel="stylesheet" href="app.css"/>
<style>
.banner{height:180px;background:linear-gradient(160deg,#2C1810,#8B4513)}
.blurred{filter:blur(2px);opacity:.55;pointer-events:none}
</style></head><body>
<div class="phone" id="screen">
  <div class="status" style="position:absolute;z-index:1;color:#fff;width:100%"><span>9:41</span><span class="icons">▮▮▮ 📶 🔋</span></div>
  <div class="content blurred">
    <div class="banner"></div>
    <div style="padding:16px"><h1 style="font-size:20px">คาเฟ่ตอนตีสาม</h1>
      <div class="ep"><div class="n">4</div><div class="meta"><div class="t">ตอนที่ 4 — ความลับบนแก้ว</div></div><span class="badge badge-lock">🪙 8</span></div>
    </div>
  </div>
  <div class="sheet-bg">
    <div class="sheet">
      <div class="handle"></div>
      <h2 style="font-size:18px;margin-bottom:4px">ยืนยันปลดล็อก</h2>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">ตอนที่ 4 — ความลับบนแก้ว · <span class="ex">ตัวอย่าง</span></p>
      <div class="card" style="margin-bottom:12px">
        <div class="row-between" style="margin-bottom:10px"><span>ราคาตอน</span><span style="font-family:var(--font-head);font-weight:700">🪙 8</span></div>
        <div class="row-between" style="margin-bottom:10px"><span>ยอดปัจจุบัน</span><span>248</span></div>
        <div class="row-between" style="border-top:1px solid var(--line);padding-top:10px"><span style="font-weight:600">ยอดหลังหัก</span><span style="font-family:var(--font-head);font-weight:700;color:var(--primary)">🪙 240</span></div>
      </div>
      <p style="font-size:11px;color:var(--text-muted);margin-bottom:14px;line-height:1.5">ปลดล็อกแล้วอ่านได้ถาวรในบัญชีนี้ · เหรียญที่ใช้ไปคืนไม่ได้</p>
      <button class="btn btn-coin btn-block">ยืนยันใช้ 8 เหรียญ</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px">ยกเลิก</button>
    </div>
  </div>
</div>
</body></html>
